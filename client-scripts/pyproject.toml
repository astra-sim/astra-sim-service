[build-system]
requires = [ "setuptools>=77", "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "astra_client"
description = "astra sim service client package"
requires-python = ">=3.10"
dependencies = ["infragraph", "astra-sim-sdk @ https://github.com/astra-sim/astra-sim-service/releases/download/v1.4.0/astra_sim_sdk-1.4.0-py3-none-any.whl", "chakra @ git+https://github.com/mlcommons/chakra.git",]
dynamic = [ "version",]

# Generated by `make version` from the repo-level .VERSION, so the wheel version
# tracks the service/sdk release it is published alongside.
[tool.setuptools.dynamic.version]
file = ".GENERATED_VERSION"

[tool.setuptools]
packages = ["astra_client"]
