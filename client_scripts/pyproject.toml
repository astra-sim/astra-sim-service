[build-system]
requires = [ "setuptools>=77", "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "astra_sim_service_client"
version = "0.2.0"
description = "astra sim service client package"
requires-python = ">=3.10"
dependencies = ["infragraph", "astra-sim-sdk @ https://github.com/astra-sim/astra-sim-service/releases/download/v1.3.1/astra_sim_sdk-1.3.1-py3-none-any.whl", "chakra @ git+https://github.com/mlcommons/chakra.git",]

[tool.setuptools]
packages = ["astra_sim_service_client", "astra_sim_service_client.utils",]

[tool.setuptools.package-dir]
astra_sim_service_client = "astra_sim_service_client"
